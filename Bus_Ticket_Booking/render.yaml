version: "1"

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - name: routexen-postgres-prod
    databaseName: routexen_db
    user: routexen_user
    plan: starter # Adjust based on your production needs

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: routexen-redis-prod
    plan: free # Adjust to 'starter' for production persistence
    ipAllowList: [] # Keeps Redis private and accessible only to your Render services

  # ── FastAPI Backend (Uvicorn) ───────────────────────────────────────────────
  - type: web # Or 'pserv' (Private Service) if only Nginx should access it
    name: routexen-backend-prod
    env: docker
    rootDir: Bus_Ticket_Booking/backend
    dockerfilePath: Dockerfile.prod
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      - key: POSTGRES_USER
        value: flight_user
      - key: POSTGRES_DB
        value: flight_db
      - key: DATABASE_URL
        fromDatabase:
          name: routexen-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: routexen-redis-prod
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: routexen-redis-prod
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: routexen-redis-prod
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@routexen.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true" 

  # ── Celery Worker ───────────────────────────────────────────────────────────
  - type: worker
    name: routexen-celery-worker-prod
    env: docker
    rootDir: Bus_Ticket_Booking/backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: celery -A app.workers.tasks worker --loglevel=info --pool=solo --concurrency=1
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: routexen-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: routexen-redis-prod
          property: connectionString

  # ── Celery Beat (Seat-hold expiry scheduler) ────────────────────────────────
  - type: worker
    name: routexen-celery-beat-prod
    env: docker
    rootDir: Bus_Ticket_Booking/backend
    dockerfilePath: Dockerfile.prod
    dockerCommand: celery -A app.workers.tasks beat --loglevel=info
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: routexen-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: routexen-redis-prod
          property: connectionString

  # ── Nginx (Reverse Proxy + Frontend Static) ────────────────────────────────
  - type: web
    name: routexen-nginx-prod
    env: docker
    rootDir: Bus_Ticket_Booking
    dockerfilePath: ./nginx/Dockerfile
    plan: starter
    envVars:
      # If your nginx.conf uses a variable to find the backend, pass the Render internal URL
      - key: BACKEND_URL
        value: http://routexen-backend-prod:8000