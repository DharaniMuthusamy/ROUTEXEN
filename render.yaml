version: "1"

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - name: flight-postgres-prod
    databaseName: flight_db
    user: flight_user
    plan: starter # Adjust based on your production needs

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: flight-redis-prod
    plan: free # Adjust to 'starter' for production persistence
    ipAllowList: [] # Keeps Redis private and accessible only to your Render services

  # ── FastAPI Backend (Uvicorn) ───────────────────────────────────────────────
  - type: web # Or 'pserv' (Private Service) if only Nginx should access it
    name: flight-backend-prod
    env: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      - key: POSTGRES_USER
        value: flight_user
      - key: POSTGRES_DB
        value: flight_db
      - key: DATABASE_URL
        fromDatabase:
          name: flight-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flight-redis-prod
          property: connectionString
      # Add remaining variables from your .env.production here
      # For secrets, use `sync: false` so they aren't stored in source control:
      # - key: SECRET_KEY
      #   sync: false 

  # ── Celery Worker ───────────────────────────────────────────────────────────
  - type: worker
    name: flight-celery-worker-prod
    env: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flight-redis-prod
          property: connectionString

  # ── Celery Beat (Seat-hold expiry scheduler) ────────────────────────────────
  - type: worker
    name: flight-celery-beat-prod
    env: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: celery -A celery_app beat --loglevel=info
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flight-redis-prod
          property: connectionString

  # ── Nginx (Reverse Proxy + Frontend Static) ────────────────────────────────
  - type: web
    name: flight-nginx-prod
    env: docker
    rootDir: .
    dockerfilePath: ./nginx/Dockerfile
    plan: starter
    envVars:
      # If your nginx.conf uses a variable to find the backend, pass the Render internal URL
      - key: BACKEND_URL
        value: http://flight-backend-prod:8000