# =============================================================================
#  Flight Ticket Booking – Docker Compose (Production)
# =============================================================================
#  Usage:
#    1. Copy .env.production.example → .env.production and fill in secrets
#    2. docker compose -f docker-compose.prod.yml up -d --build
#    3. Verify: curl http://localhost/api/health
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flight_postgres_prod
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flight_redis_prod
    restart: unless-stopped
    command: [ "redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net

  # ── FastAPI Backend (Uvicorn) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: flight_backend_prod
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: flight_celery_worker_prod
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1
    working_dir: /app
    env_file: .env.production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

  # ── Celery Beat (Seat-hold expiry scheduler) ────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: flight_celery_beat_prod
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    working_dir: /app
    env_file: .env.production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

  # ── Nginx (Reverse Proxy + Frontend Static) ────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: flight_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
